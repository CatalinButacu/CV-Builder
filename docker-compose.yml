version: '3.8'

x-latex-base: &latex-base
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/latex
    - latex-cache:/root/.texlive
  working_dir: /latex
  environment:
    - DEBIAN_FRONTEND=noninteractive
    - TZ=Europe/Bucharest

services:
  # Compiles resume.tex from whatever branch is checked out
  latex-compiler:
    <<: *latex-base
    container_name: cv-latex-compiler
    command: /usr/local/bin/compile-latex.sh

  # Interactive development shell
  latex-dev:
    <<: *latex-base
    container_name: cv-latex-dev
    command: /bin/bash
    stdin_open: true
    tty: true

volumes:
  latex-cache:
    driver: local