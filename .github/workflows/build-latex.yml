name: Build LaTeX CV with Docker

on:
  push:
    branches:
      - cpp-software-engineer
      - machine-learning-engineer
  pull_request:
    branches:
      - cpp-software-engineer
      - machine-learning-engineer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LaTeX Docker image
        run: docker build -t latex-cv-compiler .

      - name: Compile LaTeX document using Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/latex \
            -w /latex \
            latex-cv-compiler

      - name: Verify PDF generation
        run: |
          if [ -f "resume.pdf" ]; then
            echo "✅ PDF generated successfully ($(du -h resume.pdf | cut -f1))"
            ls -la resume.pdf
          else
            echo "❌ PDF generation failed"
            exit 1
          fi

      - name: Commit and push PDF to branch
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add resume.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged, skipping commit"
          else
            git commit -m "ci: update resume.pdf [skip ci]"
            git push
          fi

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cv-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          name: "CV Build #${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Build:** #${{ github.run_number }}
            **Changes:** ${{ github.event.head_commit.message }}

            📥 Download the compiled CV PDF below.
          files: resume.pdf
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}