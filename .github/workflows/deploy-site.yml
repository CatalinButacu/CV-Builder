name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - machine-learning-engineer
    paths:
      - site/**
      - .github/workflows/deploy-site.yml
  # Redeploy after every CV build, so the site always serves the latest PDF.
  workflow_run:
    workflows: ["Build LaTeX CV with Docker"]
    types: [completed]
    branches: [machine-learning-engineer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Renders every page to plain HTML. Nothing from .NET is sent to the browser.
      - name: Generate the site
        working-directory: site
        run: dotnet run -c Release -- --base "${{ steps.pages.outputs.base_path }}/" --site "${{ steps.pages.outputs.origin }}" --out ../publish

      - name: Add the CV itself
        run: cp CV_Butacu.Ionel-Catalin.pdf publish/cv.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
