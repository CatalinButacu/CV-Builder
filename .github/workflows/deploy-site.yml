name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - machine-learning-engineer
    paths:
      - site/**
      - .github/workflows/deploy-site.yml
  # Redeploy after every CV build, so the site always serves the latest PDF.
  workflow_run:
    workflows: ["Build LaTeX CV with Docker"]
    types: [completed]
    branches: [machine-learning-engineer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly site
        run: dotnet publish site/Portfolio.csproj -c Release -o publish

      # A project site lives under /<repo>/, and Pages serves 404.html for
      # unknown paths, which lets the Blazor router handle deep links.
      - name: Prepare for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="${{ steps.pages.outputs.base_path }}/" />|' publish/wwwroot/index.html
          grep -n '<base' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      # The portrait is the one the CV uses, taken from the repository root so
      # there is a single copy of it.
      - name: Add the CV photo
        run: cp profile-preview.png publish/wwwroot/profile.png

      - name: Add the CV itself
        run: cp CV_Butacu.Ionel-Catalin.pdf publish/wwwroot/cv.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
